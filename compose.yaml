name: searchmyjob-community
services:
  app:
    build: .
    image: searchmyjob-community:0.3.9
    environment:
      SEARCHMYJOB_STATE: /state
      SEARCHMYJOB_PUBLIC_PORT: ${SEARCHMYJOB_PORT:-8936}
      SEARCHMYJOB_OAUTH_PORT: ${SEARCHMYJOB_OAUTH_PORT:-8976}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:${SEARCHMYJOB_PORT:-8936}:8935"
      - "127.0.0.1:${SEARCHMYJOB_OAUTH_PORT:-8976}:${SEARCHMYJOB_OAUTH_PORT:-8976}"
    volumes:
      - data:/state
    restart: unless-stopped
    init: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8935/api/health',timeout=5).read()"]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3
volumes:
  data:
